apiVersion: v1
kind: Namespace
metadata:
  name: pulsecart
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pulsecart-config
  namespace: pulsecart
data:
  PG_DSN: postgresql://pulsecart_app@postgres:5432/pulsecart
  KAFKA_BOOTSTRAP: kafka:9092
  KAFKA_SECURITY_PROTOCOL: PLAINTEXT
  KAFKA_SASL_MECHANISM: SCRAM-SHA-256
  OPENSEARCH_URL: http://opensearch:9200
  OPENSEARCH_VERIFY_CERTS: "false"
  KAFKA_CA: /app/certs/ca_kafka.pem
  KAFKA_CERT: /app/certs/service.cert
  KAFKA_KEY: /app/certs/service.key
  API_CORS_ORIGINS: http://localhost:3000
  API_DOCS_ENABLED: "false"
  APP_ENV: production
  CHECKOUT_RATE_LIMIT: 5/minute
  CART_RATE_LIMIT: 20/minute
  SMTP_PORT: "587"
  SMTP_STARTTLS: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: pulsecart
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: pulsecart
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: pulsecart
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: pulsecart
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulsecart-secrets
                  key: POSTGRES_PASSWORD
            - name: PULSECART_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulsecart-secrets
                  key: PG_PASSWORD
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -d pulsecart"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -d pulsecart"]
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: postgres-init
          configMap:
            name: pulsecart-db-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: pulsecart
spec:
  selector:
    app: zookeeper
  ports:
    - name: client
      port: 2181
      targetPort: 2181
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: pulsecart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.6.1
          ports:
            - name: client
              containerPort: 2181
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
          readinessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: pulsecart
spec:
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: pulsecart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.6.1
          ports:
            - name: broker
              containerPort: 9092
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: zookeeper:2181
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:9092
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
          readinessProbe:
            tcpSocket:
              port: broker
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: pulsecart
spec:
  selector:
    app: opensearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opensearch-data
  namespace: pulsecart
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch
  namespace: pulsecart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch
  template:
    metadata:
      labels:
        app: opensearch
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.17.1
          ports:
            - name: http
              containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: -Xms512m -Xmx512m
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: opensearch-data
              mountPath: /usr/share/opensearch/data
      volumes:
        - name: opensearch-data
          persistentVolumeClaim:
            claimName: opensearch-data
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: pulsecart
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: pulsecart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: pulsecart-backend:local
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - python -m app.seed && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: pulsecart-config
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulsecart-secrets
                  key: PG_PASSWORD
            - name: ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: pulsecart-secrets
                  key: ADMIN_KEY
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: pulsecart-secrets
                  key: KAFKA_SASL_USERNAME
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulsecart-secrets
                  key: KAFKA_SASL_PASSWORD
            - name: OPENSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: pulsecart-secrets
                  key: OPENSEARCH_USERNAME
            - name: OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulsecart-secrets
                  key: OPENSEARCH_PASSWORD
            - name: OPENSEARCH_VERIFY_CERTS
              valueFrom:
                configMapKeyRef:
                  name: pulsecart-config
                  key: OPENSEARCH_VERIFY_CERTS
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: pulsecart-config
                  key: SMTP_HOST
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: pulsecart-secrets
                  key: SMTP_USER
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulsecart-secrets
                  key: SMTP_PASSWORD
            - name: KAFKA_CA
              valueFrom:
                configMapKeyRef:
                  name: pulsecart-config
                  key: KAFKA_CA
            - name: KAFKA_CERT
              valueFrom:
                configMapKeyRef:
                  name: pulsecart-config
                  key: KAFKA_CERT
            - name: KAFKA_KEY
              valueFrom:
                configMapKeyRef:
                  name: pulsecart-config
                  key: KAFKA_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: pulsecart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      containers:
        - name: relay
          image: pulsecart-backend:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.outbox_relay"]
          envFrom:
            - configMapRef:
                name: pulsecart-config
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulsecart-secrets
                  key: PG_PASSWORD
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: pulsecart-secrets
                  key: KAFKA_SASL_USERNAME
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulsecart-secrets
                  key: KAFKA_SASL_PASSWORD
            - name: KAFKA_CA
              valueFrom:
                configMapKeyRef:
                  name: pulsecart-config
                  key: KAFKA_CA
          volumeMounts:
            - name: kafka-ca
              mountPath: /app/certs
              readOnly: true
      volumes:
        - name: kafka-ca
          secret:
            secretName: kafka-tls
            optional: true
---
