name: CI (fast checks)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Code checks and image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password
      PULSECART_APP_PASSWORD: ci-only-app-password
      PG_PASSWORD: ci-only-app-password
      PG_DSN: postgresql://pulsecart_app@postgres:5432/pulsecart
      PG_POOL_MAX_SIZE: 2
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_USERNAME: ""
      OPENSEARCH_PASSWORD: ""
      OPENSEARCH_VERIFY_CERTS: "false"
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      KAFKA_SASL_USERNAME: ""
      KAFKA_SASL_PASSWORD: ""
      APP_ENV: development
      ADMIN_KEY: ci-only-admin-key
      CHECKOUT_RATE_LIMIT: 100/minute

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend/app

      - name: Run backend unit tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml config --quiet

      - name: Build backend and frontend images
        run: docker compose -f docker-compose.yml build backend frontend
