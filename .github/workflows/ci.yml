name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Compile backend modules
        run: python -m compileall -q backend/app

      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start services
        run: docker compose up -d --wait --wait-timeout 180 postgres zookeeper kafka opensearch

      - name: Start backend
        run: docker compose up -d --wait --wait-timeout 180 backend

      - name: Verify seeded product is available
        run: curl --fail http://localhost:8000/products/1

      - name: Run PostgreSQL integration tests
        working-directory: backend
        env:
          TEST_PG_DSN: postgresql://postgres:ci-only-password@localhost:5432/pulsecart
        run: python -m unittest tests.test_postgres_integration -v

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test

      - name: Stop services
        if: always()
        run: docker compose down

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build Compose images
        run: docker compose build
