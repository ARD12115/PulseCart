name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      POSTGRES_PASSWORD: ci-only-password
      PG_PASSWORD: ci-only-password
      PULSECART_APP_PASSWORD: ci-only-password
      APP_ENV: development
      ADMIN_KEY: dev-admin-key-change-in-production
      CHECKOUT_RATE_LIMIT: 5/minute
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Compile backend modules
        run: python -m compileall -q backend/app

      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start local PostgreSQL for integration tests
        run: |
          docker run -d --name pulsecart-pg-test \
            -e POSTGRES_PASSWORD=ci-only-password \
            -e POSTGRES_USER=pulsecart_app \
            -e POSTGRES_DB=pulsecart \
            -p 5432:5432 \
            postgres:16
          # Wait for postgres to be ready
          for i in $(seq 1 30); do
            if docker exec pulsecart-pg-test pg_isready -U pulsecart_app -d pulsecart; then
              break
            fi
            sleep 1
          done
          # Apply schema
          docker cp db/schema.sql pulsecart-pg-test:/schema.sql
          docker exec pulsecart-pg-test psql -U pulsecart_app -d pulsecart -f /schema.sql

      - name: Run PostgreSQL integration tests
        working-directory: backend
        env:
          TEST_PG_DSN: postgresql://pulsecart_app:ci-only-password@localhost:5432/pulsecart
        run: python -m unittest tests.test_postgres_integration -v

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend server for Playwright tests
        working-directory: backend
        env:
          PG_DSN: postgresql://pulsecart_app:ci-only-password@localhost:5432/pulsecart
          PG_PASSWORD: ci-only-password
          KAFKA_BOOTSTRAP: localhost:9093
          KAFKA_SECURITY_PROTOCOL: PLAINTEXT
          OPENSEARCH_URL: http://localhost:9200
          OPENSEARCH_USERNAME: ""
          OPENSEARCH_PASSWORD: ""
          ADMIN_KEY: dev-admin-key-change-in-production
          APP_ENV: development
          CHECKOUT_RATE_LIMIT: 100/minute
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          # Wait for backend to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Backend is ready"
              break
            fi
            sleep 1
          done

      - name: Run Playwright tests
        working-directory: frontend
        env:
          CI: true
          APP_ENV: development
          ADMIN_KEY: dev-admin-key-change-in-production
        run: npx playwright test --project=chromium --max-failures=5 --grep-invert "Rate limiting enforced on checkout"

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop services
        if: always()
        run: |
          docker stop pulsecart-pg-test || true
          docker rm pulsecart-pg-test || true
          pkill -f uvicorn || true

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image with GitHub Actions cache
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: pulsecart-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image with GitHub Actions cache
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: pulsecart-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
