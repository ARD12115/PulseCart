name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      POSTGRES_PASSWORD: ci-only-password
      PULSECART_APP_PASSWORD: ci-only-app-password
      PG_PASSWORD: ci-only-app-password
      PG_DSN: postgresql://pulsecart_app@postgres:5432/pulsecart
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_USERNAME: ""
      OPENSEARCH_PASSWORD: ""
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      APP_ENV: development
      ADMIN_KEY: dev-admin-key-change-in-production
      CHECKOUT_RATE_LIMIT: 100/minute
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Compile backend modules
        run: python -m compileall -q backend/app

      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start services
        run: docker compose up -d --wait --wait-timeout 180 postgres zookeeper kafka opensearch

      - name: Start backend
        run: docker compose up -d --wait --wait-timeout 180 backend

      - name: Capture backend startup diagnostics
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=200 backend seed postgres kafka opensearch
          curl --silent --show-error --max-time 5 http://localhost:8000/health || true

      - name: Verify seeded product is available
        run: curl --fail http://localhost:8000/products/1

      - name: Run PostgreSQL integration tests
        working-directory: backend
        env:
          TEST_PG_DSN: postgresql://postgres:ci-only-password@localhost:5432/pulsecart
        run: python -m unittest tests.test_postgres_integration -v

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        env:
          CI: true
          APP_ENV: production
          ADMIN_KEY: dev-admin-key-change-in-production
        run: npx playwright test --project=chromium --max-failures=5 --grep-invert "Rate limiting enforced on checkout"

      - name: Reset backend rate limiter for isolated test
        run: docker compose up -d --force-recreate --wait --wait-timeout 180 backend
        env:
          CHECKOUT_RATE_LIMIT: 5/minute

      - name: Verify checkout rate limit in isolation
        working-directory: frontend
        env:
          CI: true
          APP_ENV: development
          ADMIN_KEY: dev-admin-key-change-in-production
        run: npx playwright test --project=chromium --grep "Rate limiting enforced on checkout" --max-failures=1

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop services
        if: always()
        run: docker compose down

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image with GitHub Actions cache
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: pulsecart-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image with GitHub Actions cache
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: pulsecart-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
