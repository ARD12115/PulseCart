services:
  ###############################################################################
  # Backend API — FastAPI on port 8000
  ###############################################################################
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PG_DSN: ${PG_DSN:?Set PG_DSN in the root .env}
      PG_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in the root .env}
      PULSECART_APP_PASSWORD: ${PULSECART_APP_PASSWORD:?Set PULSECART_APP_PASSWORD in the root .env}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:?Set KAFKA_BOOTSTRAP in the root .env}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:?Set KAFKA_SECURITY_PROTOCOL in the root .env}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-SCRAM-SHA-256}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:?Set KAFKA_SASL_USERNAME in the root .env}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:?Set KAFKA_SASL_PASSWORD in the root .env}
      KAFKA_CA: "/app/certs/ca_kafka.pem"
      OPENSEARCH_URL: ${OPENSEARCH_URL:?Set OPENSEARCH_URL in the root .env}
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:?Set OPENSEARCH_USERNAME in the root .env}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:?Set OPENSEARCH_PASSWORD in the root .env}
      OPENSEARCH_VERIFY_CERTS: ${OPENSEARCH_VERIFY_CERTS:-true}
      ADMIN_KEY: ${ADMIN_KEY:?Set ADMIN_KEY in the root .env}
      APP_ENV: ${APP_ENV:-production}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000}
      CHECKOUT_RATE_LIMIT: ${CHECKOUT_RATE_LIMIT:-5/minute}
      CART_RATE_LIMIT: ${CART_RATE_LIMIT:-20/minute}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    volumes:
      - ./certs:/app/certs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ###############################################################################
  # Frontend — Next.js on port 3000
  ###############################################################################
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy

  ###############################################################################
  # Outbox Relay — publishes outbox_events to Kafka
  ###############################################################################
  relay:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PG_DSN: ${PG_DSN:?Set PG_DSN in the root .env}
      PG_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in the root .env}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:?Set KAFKA_BOOTSTRAP in the root .env}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:?Set KAFKA_SECURITY_PROTOCOL in the root .env}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-SCRAM-SHA-256}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:?Set KAFKA_SASL_USERNAME in the root .env}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:?Set KAFKA_SASL_PASSWORD in the root .env}
      KAFKA_CA: "/app/certs/ca_kafka.pem"
    volumes:
      - ./certs:/app/certs:ro
    command: ["python", "-m", "app.outbox_relay"]
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      backend:
        condition: service_healthy

  ###############################################################################
  # Search Sync — consumes Kafka events, indexes to OpenSearch
  ###############################################################################
  search-sync:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PG_DSN: ${PG_DSN:?Set PG_DSN in the root .env}
      PG_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in the root .env}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:?Set KAFKA_BOOTSTRAP in the root .env}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:?Set KAFKA_SECURITY_PROTOCOL in the root .env}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-SCRAM-SHA-256}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:?Set KAFKA_SASL_USERNAME in the root .env}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:?Set KAFKA_SASL_PASSWORD in the root .env}
      OPENSEARCH_URL: ${OPENSEARCH_URL:?Set OPENSEARCH_URL in the root .env}
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:?Set OPENSEARCH_USERNAME in the root .env}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:?Set OPENSEARCH_PASSWORD in the root .env}
      OPENSEARCH_VERIFY_CERTS: ${OPENSEARCH_VERIFY_CERTS:-true}
      KAFKA_CA: "/app/certs/ca_kafka.pem"
    volumes:
      - ./certs:/app/certs:ro
    command: ["python", "-m", "app.search_sync"]
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      backend:
        condition: service_healthy

  ###############################################################################
  # Notification — consumes order.placed events, sends confirmations
  ###############################################################################
  notification:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      PG_DSN: ${PG_DSN:?Set PG_DSN in the root .env}
      PG_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in the root .env}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:?Set KAFKA_BOOTSTRAP in the root .env}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:?Set KAFKA_SECURITY_PROTOCOL in the root .env}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-SCRAM-SHA-256}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:?Set KAFKA_SASL_USERNAME in the root .env}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:?Set KAFKA_SASL_PASSWORD in the root .env}
      KAFKA_CA: "/app/certs/ca_kafka.pem"
    volumes:
      - ./certs:/app/certs:ro
    command: ["python", "-m", "app.notification"]
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      backend:
        condition: service_healthy
