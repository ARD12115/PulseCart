services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: pulsecart
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pulsecart"]
      interval: 5s
      timeout: 5s
      retries: 20

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 10"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "127.0.0.1:9093:9093"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30

  backend:
    build:
      context: ./backend
    environment:
      PG_DSN: postgresql://postgres@postgres:5432/pulsecart
      PG_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      OPENSEARCH_URL: http://opensearch:9200
      API_CORS_ORIGINS: http://localhost:3000
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      APP_ENV: ${APP_ENV:-production}
      ADMIN_KEY: ${ADMIN_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    command: ["sh", "-c", "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 15

  relay:
    build:
      context: ./backend
    environment:
      PG_DSN: postgresql://postgres@postgres:5432/pulsecart
      PG_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
    depends_on:
      backend:
        condition: service_healthy
    command: ["python", "-m", "app.outbox_relay"]

  search-sync:
    build:
      context: ./backend
    environment:
      PG_DSN: postgresql://postgres@postgres:5432/pulsecart
      PG_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      OPENSEARCH_URL: http://opensearch:9200
    depends_on:
      backend:
        condition: service_healthy
    command: ["python", "-m", "app.search_sync"]

  notification:
    build:
      context: ./backend
    environment:
      PG_DSN: postgresql://postgres@postgres:5432/pulsecart
      PG_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
    depends_on:
      backend:
        condition: service_healthy
    command: ["python", "-m", "app.notification"]

  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  opensearch_data:
