services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
      POSTGRES_DB: pulsecart
      PULSECART_APP_PASSWORD: ${PULSECART_APP_PASSWORD:?Set PULSECART_APP_PASSWORD in the root .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./db/migrations/001_order_access_token.sql:/docker-entrypoint-initdb.d/002_order_access_token.sql:ro
      - ./db/migrations/002_carts_idempotency_notifications.sql:/docker-entrypoint-initdb.d/003_carts_idempotency_notifications.sql:ro
      - ./db/migrations/003_order_token_expiry.sql:/docker-entrypoint-initdb.d/004_order_token_expiry.sql:ro
      - ./db/migrations/004_cart_secret_and_least_privilege.sql:/docker-entrypoint-initdb.d/005_cart_secret_and_least_privilege.sql:ro
      - ./db/migrations/005_product_excel_details.sql:/docker-entrypoint-initdb.d/006_product_excel_details.sql:ro
      - ./scripts/set_pulsecart_app_password.sh:/docker-entrypoint-initdb.d/007_set_pulsecart_app_password.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pulsecart"]
      interval: 5s
      timeout: 5s
      retries: 20

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 10"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "127.0.0.1:9093:9093"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30

  seed:
    build:
      context: ./backend
    environment:
      PG_DSN: postgresql://postgres@postgres:5432/pulsecart
      PG_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "app.seed"]

  backend:
    restart: unless-stopped
    build:
      context: ./backend
    environment:
      # Local dev defaults; override with Aiven connection strings in root .env
      PG_DSN: ${PG_DSN:-postgresql://pulsecart_app@postgres:5432/pulsecart}
      PG_PASSWORD: ${PULSECART_APP_PASSWORD:?Set PULSECART_APP_PASSWORD in the root .env}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:9092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-SCRAM-SHA-256}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-admin}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-}
      OPENSEARCH_VERIFY_CERTS: ${OPENSEARCH_VERIFY_CERTS:-false}
      API_CORS_ORIGINS: http://localhost:3000
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      APP_ENV: ${APP_ENV:-production}
      ADMIN_KEY: ${ADMIN_KEY:-}
      CHECKOUT_RATE_LIMIT: ${CHECKOUT_RATE_LIMIT:-5/minute}
      CART_RATE_LIMIT: ${CART_RATE_LIMIT:-20/minute}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      seed:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 15

  relay:
    restart: unless-stopped
    build:
      context: ./backend
    environment:
      PG_DSN: ${PG_DSN:-postgresql://pulsecart_app@postgres:5432/pulsecart}
      PG_PASSWORD: ${PULSECART_APP_PASSWORD:?Set PULSECART_APP_PASSWORD in the root .env}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:9092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-SCRAM-SHA-256}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      KAFKA_CA: "/app/certs/ca_kafka.pem"
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    command: ["python", "-m", "app.outbox_relay"]

  search-sync:
    restart: unless-stopped
    build:
      context: ./backend
    environment:
      PG_DSN: ${PG_DSN:-postgresql://pulsecart_app@postgres:5432/pulsecart}
      PG_PASSWORD: ${PULSECART_APP_PASSWORD:?Set PULSECART_APP_PASSWORD in the root .env}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:9092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-SCRAM-SHA-256}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-admin}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-}
      OPENSEARCH_VERIFY_CERTS: ${OPENSEARCH_VERIFY_CERTS:-false}
      KAFKA_CA: "/app/certs/ca_kafka.pem"
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    command: ["python", "-m", "app.search_sync"]

  notification:
    restart: unless-stopped
    build:
      context: ./backend
    environment:
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      PG_DSN: ${PG_DSN:-postgresql://pulsecart_app@postgres:5432/pulsecart}
      PG_PASSWORD: ${PULSECART_APP_PASSWORD:?Set PULSECART_APP_PASSWORD in the root .env}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:9092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-SCRAM-SHA-256}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      KAFKA_CA: "/app/certs/ca_kafka.pem"
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    command: ["python", "-m", "app.notification"]

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend/public/products:/app/public/products:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  opensearch_data:
